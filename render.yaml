services:
  # ── Backend (Node + Socket.io) ──────────────────────────────
  - type: web
    name: chatify-backend
    runtime: node
    rootDir: Backend
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: MONGO_URI
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # set manually in Render dashboard
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000         # Render assigns this automatically, but explicit is fine

  # ── Frontend (Vite + React → Static Site) ───────────────────
  - type: web
    name: chatify-frontend
    runtime: static
    rootDir: Frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # set to https://chatify-backend-xxxx.onrender.com
      - key: VITE_SOCKET_URL
        sync: false          # set to same as VITE_API_URL
